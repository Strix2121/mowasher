<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُؤشّر | أسعار العملات والذهب والسلع</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --price-up: #4ade80;
            --price-down: #f87171;
            --border-color: #334155;
            --gold-color: #fbbf24;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 28px;
            margin: 0 0 5px 0;
            color: var(--accent-color);
        }

        .header p {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0;
        }

        .cards-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon {
            font-size: 22px;
            background-color: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 8px;
        }

        .item-name {
            font-size: 16px;
            font-weight: 600;
        }

        .card-price {
            text-align: left;
        }

        .price-value {
            font-size: 18px;
            font-weight: 700;
        }

        .change-tag {
            font-size: 12px;
            font-weight: 600;
            margin-top: 2px;
        }

        .up { color: var(--price-up); }
        .down { color: var(--price-down); }
        .neutral { color: var(--text-secondary); }

        /* قسم حاسبة التحويل */
        .converter-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        .converter-card h3 {
            margin: 0 0 12px 0;
            font-size: 16px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .converter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .converter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .converter-group label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .converter-group input, .converter-group select {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .converter-result {
            background-color: rgba(56, 189, 248, 0.1);
            border: 1px dashed var(--accent-color);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            margin-top: 12px;
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-color);
        }

        .loader {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>مُؤشّر</h1>
        <p>أسعار العملات والذهب والسلع لحظة بلحظة</p>
    </div>

    <!-- حاسبة تحويل العملات -->
    <div class="converter-card">
        <h3>🔄 حاسبة التحويل السريعة</h3>
        <div class="converter-grid">
            <div class="converter-group" style="grid-column: span 2;">
                <label>المبلغ:</label>
                <input type="number" id="convertAmount" value="100" oninput="calculateExchange()">
            </div>
            <div class="converter-group">
                <label>من:</label>
                <select id="convertFrom" onchange="calculateExchange()">
                    <option value="USD">دولار أمريكي ($)</option>
                    <option value="EUR">يورو (€)</option>
                    <option value="TRY">ليرة تركية (TL)</option>
                    <option value="SYP">ليرة سورية (L.S)</option>
                </select>
            </div>
            <div class="converter-group">
                <label>إلى:</label>
                <select id="convertTo" onchange="calculateExchange()">
                    <option value="SYP">ليرة سورية (L.S)</option>
                    <option value="USD">دولار أمريكي ($)</option>
                    <option value="EUR">يورو (€)</option>
                    <option value="TRY">ليرة تركية (TL)</option>
                </select>
            </div>
        </div>
        <div class="converter-result" id="convertResult">
            0 ل.س
        </div>
    </div>

    <!-- كروت عرض الأسعار -->
    <div class="cards-container" id="pricesContainer">
        <div class="loader">جاري تحميل الأسعار المباشرة...</div>
    </div>

    <script>
        // رابط نشر Google Sheets المباشر بصيغة CSV
        const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT9-T_A5Nf_E6e1G8C2mOaGfD54OaU4gG1e5z6N8v_3W9wB8R4W_rL/pub?output=csv';

        // أسعار تحويل أولية مرجعية حتى اكتمال تحميل الشيت
        let exchangeRates = {
            USD: 13800,
            EUR: 16100,
            TRY: 420
        };

        // دالة اختيار أيقونة السلعة مع سبيكة الذهب 🧈
        function getIcon(itemName) {
            if (itemName.includes('دولار')) return '💵';
            if (itemName.includes('يورو')) return '💶';
            if (itemName.includes('ذهب') || itemName.includes('ليرة ذهبية')) return '🧈'; // سبيكة الذهب
            if (itemName.includes('بنزين') || itemName.includes('مازوت')) return '⛽';
            if (itemName.includes('غاز')) return '🔥';
            if (itemName.includes('تركية') || itemName.includes('ليرة تركية')) return '🇹🇷';
            if (itemName.includes('سكر') || itemName.includes('أرز') || itemName.includes('زيت')) return '🛒';
            return '📊';
        }

        // دالة تنظيف النص وتحويله إلى رقم
        function extractNumber(valStr) {
            if (!valStr) return 0;
            const cleaned = valStr.replace(/[^0-9.]/g, '');
            return parseFloat(cleaned) || 0;
        }

        // دالة حاسبة تحويل العملات المباشرة
        function calculateExchange() {
            const amount = parseFloat(document.getElementById('convertAmount').value) || 0;
            const from = document.getElementById('convertFrom').value;
            const to = document.getElementById('convertTo').value;

            let valueInSyp = 0;

            // تحويل كل العملات إلى القيمة بالليرة السورية أولاً
            if (from === 'SYP') valueInSyp = amount;
            else if (from === 'USD') valueInSyp = amount * exchangeRates.USD;
            else if (from === 'EUR') valueInSyp = amount * exchangeRates.EUR;
            else if (from === 'TRY') valueInSyp = amount * exchangeRates.TRY;

            // تحويل من الليرة السورية إلى العملة المستهدفة
            let finalResult = 0;
            if (to === 'SYP') finalResult = valueInSyp;
            else if (to === 'USD') finalResult = valueInSyp / exchangeRates.USD;
            else if (to === 'EUR') finalResult = valueInSyp / exchangeRates.EUR;
            else if (to === 'TRY') finalResult = valueInSyp / exchangeRates.TRY;

            // عرض النتيجة
            if (to === 'SYP') {
                document.getElementById('convertResult').innerText = Math.round(finalResult).toLocaleString('ar-SY') + ' ل.س';
            } else {
                document.getElementById('convertResult').innerText = finalResult.toFixed(2) + ' ' + to;
            }
        }

        // دالة جلب البيانات المباشرة من الشيت وتحديث الصفحة
        async function fetchPrices() {
            try {
                const response = await fetch(sheetURL + '&t=' + new Date().getTime());
                const data = await response.text();
                const rows = data.split('\n').map(row => row.split(','));

                let html = '';

                for (let i = 1; i < rows.length; i++) {
                    const itemName = rows[i]?.[0]?.trim();
                    const itemPrice = rows[i]?.[1]?.trim();
                    const itemChange = rows[i]?.[2]?.trim() || '0';

                    if (itemName && itemPrice) {
                        const priceNum = extractNumber(itemPrice);

                        // التقاط أسعار العملات لتغذية حاسبة التحويل
                        if (itemName.includes('دولار دمشق') || (itemName.includes('دولار') && exchangeRates.USD === 13800)) {
                            if (priceNum > 0) exchangeRates.USD = priceNum;
                        }
                        if (itemName.includes('يورو') && priceNum > 0) {
                            exchangeRates.EUR = priceNum;
                        }
                        if ((itemName.includes('تركية') || itemName.includes('ليرة تركية')) && priceNum > 0) {
                            exchangeRates.TRY = priceNum;
                        }

                        // إعداد التنسيق واللون لعلامة التغير
                        let changeClass = 'neutral';
                        let changeText = itemChange;
                        const numChange = parseFloat(itemChange);

                        if (numChange > 0) {
                            changeClass = 'up';
                            changeText = '+' + itemChange;
                        } else if (numChange < 0) {
                            changeClass = 'down';
                        }

                        html += `
                            <div class="card">
                                <div class="card-info">
                                    <span class="icon">${getIcon(itemName)}</span>
                                    <span class="item-name">${itemName}</span>
                                </div>
                                <div class="card-price">
                                    <div class="price-value">${itemPrice} <small style="font-size:11px; color: var(--text-secondary);">ل.س</small></div>
                                    <div class="change-tag ${changeClass}">${changeText}</div>
                                </div>
                            </div>
                        `;
                    }
                }

                document.getElementById('pricesContainer').innerHTML = html;
                calculateExchange(); // إعادة احتساب النتيجة بالأسعار الجديدة

            } catch (error) {
                console.log('جاري المزامنة مع الشيت...');
            }
        }

        fetchPrices();
        setInterval(fetchPrices, 15000); // تحديث تلقائي كل 15 ثانية
    </script>
</body>
</html>
